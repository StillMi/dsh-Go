# 鲸鲸加的：一键出 APK（官方 CI 只跑检查，不产包）。
# 在 Actions 页面点 "build-apk" → Run workflow，跑完在 Artifacts 下 dsh-go-release-apk。
name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: pub get
        working-directory: app
        run: flutter pub get

      - name: build apk
        working-directory: app
        # 这个工程用 productFlavors 按 ABI 拆包（arm64 / x64），产物名是
        # app-<flavor>-release.apk，flutter 找不到 app-release.apk 就会报 exit 1。
        # 所以显式指定 flavor，并把产物改名回 app-release.apk 供 upload 用。
        run: flutter build apk --release --flavor arm64 --target-platform android-arm64

      - name: normalize apk name
        working-directory: app
        run: |
          ls -lh build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-arm64-release.apk build/app/outputs/flutter-apk/app-release.apk

      - name: show artifacts
        run: ls -lh app/build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-release-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
